server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker DNS — re-resolve tegger-api after recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    # IMPORTANT: with a variable in proxy_pass, do NOT put a URI path after
    # the host (e.g. .../api/) — nginx then drops the real request path and
    # FastAPI returns {"detail":"Not Found"} for /api/auth/login and /api/health.
    location /api/ {
        set $tegger_upstream tegger-api:8000;
        proxy_pass http://$tegger_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 30m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
